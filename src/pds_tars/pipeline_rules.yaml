# ── Mission landing pages ──────────────────────────────────────────────────────
# Maps PDS investigation name strings to a public mission landing page URL.
# Names matched case-insensitively, same as mission_types.
#
# URL hierarchy used per mission (best available wins):
#   1. NASA Science (science.nasa.gov/mission/) — modern, visual, NASA missions
#   2. Agency site  (ESA, JAXA)                 — for non-NASA missions
#   3. NASA citizen-science page                — Radio JOVE
#   4. ATM data archive                         — ground-based observations with
#                                                 no dedicated mission page
#
# All URLs verified June 2026.

mission_landing_pages:

  - names: ["Pioneer 10"]
    url: "https://science.nasa.gov/mission/pioneer-10/"

  - names: ["Pioneer 11"]
    url: "https://science.nasa.gov/mission/pioneer-11/"

  - names: ["RAV1CIUN", "Voyager", "VOYAGER", "Voyager 1", "Voyager 2", "Voyager Mission"]
    canonical_name: "Voyager"
    url: "https://science.nasa.gov/mission/voyager/"

  - names: ["GALILEO ORBITER", "GALILEO PROBE", "Galileo"]
    canonical_name: "Galileo"
    url: "https://science.nasa.gov/mission/galileo/"

  - names: ["Cassini", "Cassini-Huygens", "Cassini-Huygens Mission"]
    canonical_name: "Cassini-Huygens"
    url: "https://science.nasa.gov/mission/cassini/"

