  - name: "huygens_hk.hp"
    display_name: "Huygens Housekeeping (HK)"
  - name: "ssp.hp"
    display_name: "Huygens Surface Science Package (SSP)"
  - name: "instrument.ra__phx"
    display_name: "Phoenix Robotic Arm (RA)"
  - name: "vex.mag"
