# ── Display order ──────────────────────────────────────────────────────────────
# The order sections, and rows within each section, appear in the tables.
# This is NOT the list of sections and categories: those come from the
# science sorting pairs on bundle labels ("Section:Category" values, whose
# master list is the sorting dictionary). A section or row the pairs use that
# isn't listed here still appears, after the listed ones, alphabetically.

display_order:

  Electromagnetic Spectrum:
    - Radio
    - Radar
    - Microwave
    - IR
    - Visual
    - UV
    - X-Rays
    - Gamma Rays

  Particles & Fields:
    - Altimetry
    - Gravitational Fields
    - Magnetic Fields
    - Electric Fields
    - Plasma
    - Plasma Waves
    - Electron Temperature
    - Energetic Particles
    - Neutrons
    - Cosmic Rays

  Atmosphere:
    - Clouds
    - Winds
    - Isotopic Ratios
    - Density
    - Atmospheric Composition
    - Temperature & Pressure Profiles
    - Ionosphere
    - Exosphere

  Additional Categories:
    - Dust

# ── Omitted instruments ────────────────────────────────────────────────────────
# Instrument display names (case-insensitive) excluded from all pipeline
# output — infrastructure entries in shared PDS collections, not real science
# instruments.

omitted_instruments:
  - "NASA Deep Space Network Radio Science (RSS)"
  - "ngims_maven"

# ── Collection date overrides ───────────────────────────────────────────────────
# Exact collection LIDs with a corrected Time_Coordinates value; list only the
# field(s) that are actually wrong (an entry with just "start" leaves stop
# untouched).

collection_date_overrides:
  - collection_lid: "urn:nasa:pds:vg2-lecp-urn:data-scan-24sec-asc::1.0"
    start: "1986-01-24T00:00:00Z"
  - collection_lid: "urn:nasa:pds:vg2-lecp-urn:data-scan-24sec-bin::1.0"
    start: "1986-01-24T00:00:00Z"
  - collection_lid: "urn:nasa:pds:mars2020_supercam:calibration_supercam::4.0"
    start: null
    stop: null

# ── Mission type metadata ──────────────────────────────────────────────────────
# Single source of truth for the §3.4 mission_type vocabulary.
#
# Adding a new mission type:
#   1. Add an entry here (type, priority, label, color; text_color only if not #fff).
#   2. Add its investigation-name mappings in mission_types below.
#   3. Add a landing-page entry in mission_landing_pages if applicable.
#   No code changes needed — rule_engine.py and render_html.py read this.
#
# priority: lower = more specific spacecraft role (wins in multi-mission tie-breaks).
# color:    chip background color in the pretty HTML table.
# text_color: chip text color; defaults to #fff when absent.

mission_type_display:
  - type: probe
    priority: 1
    label: Probe
    color: "#c07830"
  - type: lander
    priority: 2
    label: Lander
    color: "#8b5e3c"
  - type: rover
    priority: 3
    label: Rover
    color: "#7055b0"
  - type: orbiter
    priority: 4
    label: Orbiter
    color: "#2e7d3a"
  - type: flyby
    priority: 5
    label: Flyby
    color: "#3d7ebf"
  - type: ground_based
    priority: 6
    label: Ground-based
    color: "#607080"
  - type: unknown
    priority: 7
    label: Unknown
    color: "#9aa5b0"
    text_color: "#222"

