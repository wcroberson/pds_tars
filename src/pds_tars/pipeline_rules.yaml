# ── Category vocabulary ────────────────────────────────────────────────────────
# Display categories grouped by section (drives the GUI checkboxes and the
# output table banners). Add a row here plus matching rules under
# category_rules below; add a new section by adding a key here and rules for
# each of its labels.

sections:

  Electromagnetic Spectrum:
    - Radio
    - Radar
    - Microwave
    - IR
    - Visual
    - UV
    - X-Rays
    - Gamma Rays

  Particles & Fields:
    - Altimetry
    - Gravitational Fields
    - Magnetic Fields
    - Electric Fields
    - Plasma
    - Plasma Waves
    - Electron Temperature
    - Energetic Particles
    - Neutrons
    - Cosmic Rays

  Atmosphere:
    - Clouds
    - Winds
    - Isotopic Ratios
    - Density
    - Atmospheric Composition
    - Temperature & Pressure Profiles
    - Ionosphere
    - Exosphere

  Additional Categories:
    - Dust

# ── Detection rules ────────────────────────────────────────────────────────────
# Each category maps to a list of rules, evaluated in order; any match assigns
# the category. attribute_keyword matches keyword against one or more PDS4
# fields (title, discipline, facet1, facet2, wavelength_range, description,
# domain), optionally narrowed by exclude_keyword/exclude_investigation.
# hardcoded_instruments matches exact registry display names as a last
# resort (no exclude_keyword — not evaluated for this type).

category_rules:

  # ── Electromagnetic Spectrum ──────────────────────────────────────────────────

  Radio:
    - type: attribute_keyword
      fields: [title]
      keyword: radio
      exclude_keyword: [radiometer]
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: radio science
    - type: attribute_keyword
      fields: [wavelength_range]
      keyword: radio

  Radar:
    - type: attribute_keyword
      fields: [title]
      keyword: radar
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: radar

  Microwave:
    - type: attribute_keyword
      fields: [title]
      keyword: microwave
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: microwave
    - type: attribute_keyword
      fields: [wavelength_range]
      keyword: submillimeter

  IR:
    - type: attribute_keyword
      fields: [title]
      keyword: infrared
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: infrared
    - type: hardcoded_instruments
      names:
        - "Mars Global Surveyor Spacecraft Thermal Emission Spectrometer (TES)"
        - "Mars Exploration Rover Spirit Miniature Thermal Emission Spectrometer (MINI-TES)"
        - "Mars Exploration Rover Opportunity Miniature Thermal Emission Spectrometer (MINI-TES)"
    - type: hardcoded_instruments
      names:
        - "Solar Flux Radiometer for Pioneer Venus Large Probe"
        - "Net Flux Radiometer for Pioneer Venus Small Probe (Day)"
        - "Net Flux Radiometer for Pioneer Venus Small Probe (Night)"
        - "Net Flux Radiometer for Pioneer Venus Small Probe (North)"
    - type: hardcoded_instruments
      names:
        - "Net Flux Radiometer (NFR) for Galileo Probe"
    - type: hardcoded_instruments
      names:
        - "Imaging Science Subsystem - Narrow Angle (ISSNA) for CO"
        - "Imaging Science Subsystem - Wide Angle (ISSWA) for CO"
    - type: hardcoded_instruments
      names:
        - "Photopolarimeter Radiometer (PPR) for Galileo Orbiter"
    - type: attribute_keyword
      fields: [description]
      keyword: irtf photometry of io

  Visual:
    - type: attribute_keyword
      fields: [title]
      keyword: visible
    - type: attribute_keyword
      fields: [title]
      keyword: visual
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: visible
    - type: hardcoded_instruments
      names:
        - "Imaging Science Subsystem - Narrow Angle (ISSNA) for CO"
        - "Imaging Science Subsystem - Wide Angle (ISSWA) for CO"
    - type: hardcoded_instruments
      names:
        - "Juno JunoCam (JUNOCAM)"
    - type: attribute_keyword
      fields: [description]
      keyword: lowell observatory

  UV:
    - type: attribute_keyword
      fields: [title]
      keyword: ultraviolet
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: ultraviolet
    - type: attribute_keyword
      fields: [description]
      keyword: tangent point of the maven-sun line

  X-Rays:
    - type: attribute_keyword
      fields: [title]
      keyword: x-ray
    - type: attribute_keyword
      fields: [title]
      keyword: xray
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: x-ray

  Gamma Rays:
    - type: attribute_keyword
      fields: [title]
      keyword: gamma
    - type: attribute_keyword
      fields: [discipline, facet1, facet2, wavelength_range]
      keyword: gamma

  # ── Particles & Fields ────────────────────────────────────────────────────────

  Altimetry:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: altimetr
    - type: attribute_keyword
      fields: [description]
      keyword: altimetr

  Gravitational Fields:
    - type: attribute_keyword
      fields: [title]
      keyword: gravity science instrument
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: gravity
    - type: attribute_keyword
      fields: [description]
      keyword: gravity

  Magnetic Fields:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: magnetic

  Electric Fields:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: electric

  Plasma Waves:
    - type: attribute_keyword
      fields: [title]
      keyword: wave
      exclude_keyword: [microwave]
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: plasma wave

  Plasma:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: plasma
      exclude_keyword: [plasma wave]
    - type: attribute_keyword
      fields: [title]
      keyword: plasma
      exclude_keyword: [plasma wave]

  Electron Temperature:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: electron
      exclude_keyword: [energetic, cosmic ray]

  Energetic Particles:
    - type: attribute_keyword
      fields: [title]
      keyword: energetic particles
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: energetic
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: charged particle

  Neutrons:
    - type: attribute_keyword
      fields: [title]
      keyword: neutron
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: neutron

  Cosmic Rays:
    - type: attribute_keyword
      fields: [discipline, facet1, facet2]
      keyword: cosmic

  # ── Atmosphere ─────────────────────────────────────────────────────────────────

  Clouds:
    - type: attribute_keyword
      fields: [title]
      keyword: nephelometer
    - type: attribute_keyword
      fields: [title]
      keyword: cloud
    - type: hardcoded_instruments
      names:
        - "Phoenix Lander Meteorology Suite LIDAR (LIDAR)"
    - type: hardcoded_instruments
      names:
        - "acp.hp"
    - type: hardcoded_instruments
      names:
        - "disr.hp"
    - type: hardcoded_instruments
      names:
        - "Photopolarimeter Radiometer (PPR) for Galileo Orbiter"
    - type: hardcoded_instruments
      names:
        - "Mars Reconnaissance Orbiter Compact Reconnaissance Imaging Spectrometer (CRISM) for Mars"
        - "Mars Science Laboratory Curiosity Rover Navigation Camera (NAVCAM)"
        - "Phoenix Lander Surface Stereo Imager (SSI)"
    - type: attribute_keyword
      fields: [description]
      keyword: lowell observatory
    - type: hardcoded_instruments
      names:
        - "Mars Global Surveyor Spacecraft Thermal Emission Spectrometer (TES)"
        - "Viking Orbiter 1 Spacecraft Infrared Thermal Mapper (IRTM)"
        - "Viking Orbiter 2 Spacecraft Infrared Thermal Mapper (IRTM)"
        - "Imaging Science Subsystem - Narrow Angle (ISSNA) for CO"
