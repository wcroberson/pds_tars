# ── Instrument-name type overrides ────────────────────────────────────────────
# Applied by exact instrument name, after all mission_types lookups — for a
# missing/too-coarse investigation-name match. Optional fields: type/url
# override the mission_type_display chip and landing-page link; investigation
# replaces the instrument's mission entirely (a PDS4 collection only ever
# carries one investigation, so a joint/derived product can misattribute an
# instrument to the wrong spacecraft); display_name overrides a LID-derived
# instrument name.
instrument_type_overrides:
  - names: ["mauna_kea.2m24.tinsley_phot"]
    type: ground_based
    display_name: "Mauna Kea 2.24m Tinsley Photometer"
  - names: ["mcdonald.smith2m7.p45a_phot"]
    type: ground_based
    display_name: "McDonald 2.7m P45A Photometer"

  - names: *pv_las_sas_names
    type: probe
    url: "https://science.nasa.gov/mission/pioneer-venus-2/"
  - names:
      - "Gas Chromatograph for Pioneer Venus Large Probe"
      - "Infrared Radiometer for Pioneer Venus Large Probe"
      - "Nephelometer for Pioneer Venus Large Probe"
      - "Nephelometer for Pioneer Venus Small Probe (Day)"
      - "Nephelometer for Pioneer Venus Small Probe (Night)"
      - "Nephelometer for Pioneer Venus Small Probe (North)"
      - "Net Flux Radiometer for Pioneer Venus Small Probe (Day)"
      - "Net Flux Radiometer for Pioneer Venus Small Probe (Night)"
      - "Net Flux Radiometer for Pioneer Venus Small Probe (North)"
      - "Neutral Mass Spectrometer for Pioneer Venus Large Probe"
      - "Solar Flux Radiometer for Pioneer Venus Large Probe"
      - "PIONEER VENUS LARGE PROBE DIFFERENTIAL LONG BASE LINE INTERFEROMETER"
      - "PIONEER VENUS SMALL PROBE (DAY) DIFFERENTIAL LONG BASE LINE INTERFEROMETER"
      - "PIONEER VENUS SMALL PROBE (NIGHT) DIFFERENTIAL LONG BASE LINE INTERFEROMETER"
      - "PIONEER VENUS SMALL PROBE (NORTH) DIFFERENTIAL LONG BASE LINE INTERFEROMETER"
    type: probe
    url: "https://science.nasa.gov/mission/pioneer-venus-2/"

  - names: ["Radio Science Subsystem (RSS) for Mariner 9"]
    investigation: "Mariner 9"
  - names:
      - "Viking Orbiter 1 Spacecraft Radio Science Subsystem (RSS)"
      - "Viking Orbiter 2 Spacecraft Radio Science Subsystem (RSS)"
    investigation: "Viking Orbiters 1 and 2"
  # The co_iss_global-maps bundle label names its investigation "Name" (a
  # template placeholder); the same instrument's collections name
  # "Cassini-Huygens" on every target (and also "Cassini" on Saturn).
  # "Cassini-Huygens" resolves to orbiter at Saturn and flyby elsewhere in
  # mission_types; "Cassini" has a Saturn entry only.
  - names: ["Imaging Science Subsystem - Narrow Angle (ISSNA) for CO"]
    investigation: "Cassini-Huygens"

# ── Display name overrides ─────────────────────────────────────────────────────
# For instruments where the PDS registry stores a LID-derived or redundant
# self-referential name instead of a human-readable title — replaces the PDS
# name (name) with display_name everywhere it appears.
display_name_overrides:
  - name: "acp.hp"
    display_name: "Huygens Aerosol Collector and Pyrolyser (ACP)"
