        - "Infrared Interferometer Spectrometer (IRIS)"
        - "Mars Oxygen In-Situ Resource Utilization Experiment (MOXIE) for Mars 2020"
        - "Ultraviolet Spectrometer (UVS) for Galileo Orbiter"
        - "Jovian Infrared Auroral Mapper (JIRAM) for Juno"
        - "Juno Ultraviolet Spectrograph (UVS)"
